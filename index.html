<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דשבורד נציגים — יש לי זכות</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&family=Frank+Ruhl+Libre:wght@500;700&family=Suez+One&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg-1: #eef2fb; --bg-2: #e6ebf7;
  --card: #ffffff;
  --panel-grad: linear-gradient(95deg, #dbe6fc 0%, #e8e3f7 100%);
  --ink: #16213e; --ink-soft: #5b6478; --ink-mute: #9aa2b5;
  --navy: #1b2a4a; --blue: #2f6df0; --blue-d: #1e3a5f;
  --orange: #ff6a2c; --orange-d: #e8531a;
  --green: #1fa971; --purple: #7b5fc9;
  --gold-1:#f6d976; --gold-2:#d4a437; --gold-3:#a87b1e;
  --silver-1:#e8ecf2; --silver-2:#b8c0cc; --silver-3:#8a93a3;
  --bronze-1:#e8b487; --bronze-2:#c87b3f; --bronze-3:#9a5a28;
  --track: #eef0f5; --line: #e8ebf2;
  --shadow: 0 6px 22px rgba(27,42,74,.07);
}
html,body { height:100%; }
body {
  font-family:'Heebo',sans-serif;
  background:radial-gradient(1200px 600px at 70% -10%, #f3f6ff 0%, var(--bg-1) 45%, var(--bg-2) 100%);
  color:var(--ink); overflow:hidden; height:100vh; display:flex; flex-direction:column;
}

/* ---------- TOP BAR ---------- */
.topbar { display:flex; align-items:center; justify-content:space-between; padding:14px 26px 10px; gap:18px; }
.clock-box { display:flex; align-items:center; gap:10px; }
.clock { background:var(--navy); color:#fff; font-weight:800; font-size:30px; letter-spacing:1px;
  padding:8px 18px; border-radius:14px; font-variant-numeric:tabular-nums; box-shadow:var(--shadow); }
.date-box { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:7px 14px;
  display:flex; flex-direction:column; align-items:center; line-height:1.25; box-shadow:var(--shadow); }
.date-greg { font-weight:800; font-size:15px; }
.date-heb { font-size:12px; color:var(--ink-soft); font-weight:600; }

.center-top { flex:1; display:flex; flex-direction:column; align-items:center; gap:10px; }
.quote { font-size:23px; font-weight:800; color:var(--blue-d); text-align:center; transition:opacity .45s ease;
  line-height:1.25; letter-spacing:-0.2px;
  background:linear-gradient(180deg,#ffffff,#f3f7ff);
  border:2px solid #cddcf7; border-radius:16px;
  padding:11px 38px; box-shadow:0 6px 18px rgba(30,58,95,.09);
  max-width:1020px; min-height:84px;
  display:flex; align-items:center; justify-content:center; }
.total-pill { display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:linear-gradient(135deg,#3f7bf6,#6a5bd6); color:#fff; border-radius:18px; padding:6px 30px;
  box-shadow:0 8px 20px rgba(63,123,246,.35); }
.total-pill .lbl { font-size:12px; font-weight:600; opacity:.9; }
.total-pill .num { font-size:30px; font-weight:900; line-height:1; font-variant-numeric:tabular-nums; }

.brand { display:flex; align-items:center; }
.brand-img { height:128px; width:auto; display:block; background:#fff; border-radius:16px;
  padding:8px 20px; box-shadow:var(--shadow); }

/* ---------- MAIN GRID ---------- */
.main { flex:1; display:grid; grid-template-columns:1fr 430px; gap:16px; padding:6px 22px 12px; min-height:0; }
.col { display:flex; flex-direction:column; gap:14px; min-height:0; }

.panel { background:var(--card); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column; }
.panel-head { background:var(--panel-grad); padding:11px 18px; display:flex; align-items:center; justify-content:space-between; }
.panel-title { font-weight:800; font-size:15px; color:var(--blue-d); display:flex; align-items:center; gap:8px; }
.live-dot { display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:800; color:var(--orange); }
.live-dot::before { content:''; width:8px; height:8px; border-radius:50%; background:var(--orange); animation:pulse 1.4s infinite; }
@keyframes pulse { 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.35; transform:scale(.7);} }

/* ---------- PODIUM ---------- */
.podium { flex:1; display:flex; align-items:flex-end; justify-content:center; gap:16px; padding:8px 22px 0; }
.pod { display:flex; flex-direction:column; align-items:center; width:120px; }
.pod-crown { font-size:34px; line-height:1; height:40px; filter:drop-shadow(0 3px 5px rgba(212,164,55,.55)); transition:opacity .4s; }
.pod-name { font-weight:800; font-size:18px; color:var(--ink); margin:0 0 8px; }
.pod-bar { width:100%; border-radius:16px 16px 0 0; display:flex; align-items:flex-start; justify-content:center;
  padding-top:18px; color:#fff; transition:height .6s cubic-bezier(.22,1,.36,1);
  box-shadow:inset 0 3px 12px rgba(255,255,255,.25), 0 -4px 14px rgba(27,42,74,.08); }
.pod-num { font-size:38px; font-weight:900; font-variant-numeric:tabular-nums; color:#fff; text-shadow:0 2px 5px rgba(0,0,0,.22); }
.pod.p1 .pod-bar { background:linear-gradient(180deg,#5b93ff,#1e3a5f); }
.pod.p2 .pod-bar { background:linear-gradient(180deg,#3fc78f,#1d6b48); }
.pod.p3 .pod-bar { background:linear-gradient(180deg,#a48fe6,#5b4791); }

/* ---------- MEDALS ---------- */
.medals { flex:1; display:flex; align-items:stretch; justify-content:center; gap:12px; padding:16px 18px 20px; }
.medal { flex:1; border-radius:16px; padding:16px 10px 14px; display:flex; flex-direction:column; align-items:center; gap:7px;
  position:relative; color:#fff; transition:all .6s cubic-bezier(.22,1,.36,1); box-shadow:0 6px 14px rgba(0,0,0,.12); }
.medal.gold   { background:linear-gradient(160deg,var(--gold-1),var(--gold-2) 60%,var(--gold-3)); transform:translateY(-10px) scale(1.05); z-index:2; }
.medal.silver { background:linear-gradient(160deg,var(--silver-1),var(--silver-2) 60%,var(--silver-3)); }
.medal.bronze { background:linear-gradient(160deg,var(--bronze-1),var(--bronze-2) 60%,var(--bronze-3)); }
.medal-badge { position:absolute; top:9px; left:9px; font-size:17px; filter:drop-shadow(0 1px 2px rgba(0,0,0,.25)); }
.medal-av { width:58px; height:58px; border-radius:50%; background:rgba(255,255,255,.28); border:2.5px solid rgba(255,255,255,.7);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:22px; color:#fff;
  position:relative; overflow:hidden; }
.medal-name { font-weight:800; font-size:15px; text-shadow:0 1px 2px rgba(0,0,0,.18); }
.medal-lbl { font-size:10.5px; opacity:.9; font-weight:600; }
.medal-num { font-size:26px; font-weight:900; line-height:1; font-variant-numeric:tabular-nums; text-shadow:0 1px 3px rgba(0,0,0,.2); }

/* ---------- TABLE ---------- */
.table-panel { flex:1; min-height:0; }
.thead { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,.82fr) minmax(0,.82fr) minmax(0,.56fr) minmax(0,.78fr) minmax(0,1fr) minmax(0,1fr) minmax(0,.7fr); padding:6px 20px; gap:8px; }
.thead div { font-size:13px; font-weight:800; color:var(--blue-d); }
.thead .t-name { text-align:right; } .thead .t-num,.thead .t-pct{ text-align:center; }
.rows { flex:1; overflow:hidden; padding:6px 14px 10px; position:relative; }
.rows-track { display:flex; flex-direction:column; gap:9px; will-change:transform; }
.row { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,.82fr) minmax(0,.82fr) minmax(0,.56fr) minmax(0,.78fr) minmax(0,1fr) minmax(0,1fr) minmax(0,.7fr); align-items:center; gap:8px;
  background:#fff; border:1px solid var(--line); border-radius:13px; padding:11px 16px;
  position:relative; box-shadow:0 2px 8px rgba(27,42,74,.04); flex-shrink:0; }
.row::before { content:''; position:absolute; right:0; top:12px; bottom:12px; width:5px; border-radius:5px; background:var(--blue); }
.row.hot::before { background:var(--orange); }
.r-name { display:flex; align-items:center; gap:12px; }
.r-av { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-weight:800; font-size:17px; color:#fff; background:var(--blue); flex-shrink:0; box-shadow:0 3px 8px rgba(47,109,240,.3);
  position:relative; overflow:hidden; }
.row.hot .r-av { background:var(--orange); box-shadow:0 3px 8px rgba(255,106,44,.35); }
/* תמונת נציג בעיגול (אם קיימת בתיקיית photos) — אחרת נשארת האות */
.av-photo { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.av-letter { position:relative; z-index:0; }
.r-namet { font-weight:800; font-size:21px; }
.r-cell { display:flex; flex-direction:column; align-items:center; gap:5px; }
.r-val { font-weight:800; font-size:22px; font-variant-numeric:tabular-nums; line-height:1.1; }
.r-bar { width:78%; height:9px; border-radius:6px; background:var(--track); overflow:hidden; }
.r-bar > i { display:block; height:100%; border-radius:6px; transition:width .7s cubic-bezier(.22,1,.36,1); }
.bar-fill { background:linear-gradient(90deg,#ff8a4c,var(--orange)); }
.bar-cool { background:linear-gradient(90deg,#5b8df5,var(--blue)); }
.bar-track-full > i { width:100% !important; background:#d8dde8; }
.r-pct { font-size:26px; font-weight:900; font-variant-numeric:tabular-nums; text-align:center; }
.r-pct.hot { color:var(--orange); } .r-pct.cool { color:var(--blue); }
.r-money { text-align:center; font-weight:800; font-size:20px; font-variant-numeric:tabular-nums; color:var(--green); white-space:nowrap; }
.r-money.bonus { color:var(--gold-3); }
.r-money .cur { font-size:14px; opacity:.7; margin-inline-start:2px; }
.r-late { text-align:center; font-weight:800; font-size:20px; font-variant-numeric:tabular-nums; color:var(--ink-mute); }
.r-late.has { color:#d92d2d; }
.r-avg { text-align:center; font-weight:800; font-size:21px; font-variant-numeric:tabular-nums; color:var(--purple); }

/* שורת "משתמשים מחוקים" — אותו מבנה של שורה רגילה, אבל מעומעמת ובמסגרת
   מקווקוות, כדי שיהיה ברור שזו שורת סיכום ולא נציג שמתחרה בדירוג */
.row.removed { background:#fafbfd; border-style:dashed; border-color:#dde3ee; box-shadow:none; }
.row.removed::before { background:#c9d0dd; }
.row.removed .r-av { background:#c9d0dd; box-shadow:none; font-size:19px; }
.row.removed .r-namet { color:var(--ink-soft); }
.row.removed .r-val { color:var(--ink-soft); }
.row.removed .r-pct, .row.removed .r-avg,
.row.removed .r-money, .row.removed .r-late { color:var(--ink-mute); }

.bump { animation:bump .6s ease; }
@keyframes bump { 0%{transform:scale(1);} 35%{transform:scale(1.18);} 100%{transform:scale(1);} }

/* status / source badge */
.src { display:none; position:fixed; bottom:8px; left:10px; font-size:10px; color:var(--ink-mute); background:rgba(255,255,255,.7);
  padding:3px 8px; border-radius:8px; z-index:5; }

/* ================================================================
   חגיגת "עסקה נסגרה" — שכבה מעל הדשבורד (הדשבורד ממשיך לרוץ מתחת)
   ================================================================ */
#celeb { position:fixed; inset:0; z-index:999; display:none; align-items:center; justify-content:center; overflow:hidden; background:#0f1f36; }
#celeb.on { display:flex; }
/* רקע: 4 צבעי הלוגו בכתמים מטושטשים שנעים לאט */
#celeb .cel-aura { position:absolute; inset:0; overflow:hidden; filter:blur(90px) saturate(1.1); }
#celeb .cel-blob { position:absolute; border-radius:50%; will-change:transform; }
#celeb .cb1 { width:58vw; height:58vw; top:-22%; right:-12%; background:#3d6fb8; opacity:.55; animation:celdrift1 19s ease-in-out infinite alternate; }
#celeb .cb2 { width:56vw; height:56vw; bottom:-26%; left:-16%; background:#1b3a63; opacity:.75; animation:celdrift2 23s ease-in-out infinite alternate; }
#celeb .cb3 { width:36vw; height:36vw; bottom:-8%; right:8%; background:#7fa8d0; opacity:.35; animation:celdrift3 17s ease-in-out infinite alternate; }
#celeb .cb4 { width:42vw; height:42vw; top:-14%; left:14%; background:#aab8e8; opacity:.32; animation:celdrift2 27s ease-in-out infinite alternate-reverse; }
@keyframes celdrift1 { from{transform:translate(0,0) scale(1);} to{transform:translate(-16vw,14vh) scale(1.22);} }
@keyframes celdrift2 { from{transform:translate(0,0) scale(1.1);} to{transform:translate(14vw,-12vh) scale(.92);} }
@keyframes celdrift3 { from{transform:translate(0,0) scale(1);} to{transform:translate(-12vw,-10vh) scale(1.3);} }
#celeb .cel-vig { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 45%, transparent 40%, rgba(8,13,24,.55) 100%); }
#celeb .cel-fx { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
#celeb .cel-flash { position:absolute; inset:0; pointer-events:none; opacity:0;
  background:radial-gradient(circle at 50% 45%, rgba(255,230,150,.32), transparent 44%); }
#celeb.on .cel-flash { animation:celflash .9s ease-out 1.1s both; }
@keyframes celflash { 0%{opacity:.95;} 100%{opacity:0;} }
#celeb .cel-wrap { position:relative; z-index:10; display:flex; flex-direction:column; align-items:center; gap:26px; }
/* שלב 1: כותרת נכנסת לבד במרכז, מחזיקה, ועולה למקומה */
#celeb .cel-title { font-family:'Frank Ruhl Libre','Heebo',serif; font-weight:500; font-size:60px; line-height:1; color:#f3efe2;
  letter-spacing:4px; text-shadow:0 3px 14px rgba(0,0,0,.3); text-align:center; }
#celeb .cel-title::after { content:''; display:block; width:150px; height:1.5px; margin:18px auto 0;
  background:linear-gradient(90deg,transparent,#d4a437 30%,#f6d976 50%,#d4a437 70%,transparent); }
#celeb.on .cel-title { animation:celtitle 2.3s cubic-bezier(.22,1,.36,1) both; }
@keyframes celtitle {
  0%   { transform:translateY(21vh) scale(1.6); opacity:0; filter:blur(14px); }
  16%  { transform:translateY(21vh) scale(1.28); opacity:1; filter:blur(0); }
  58%  { transform:translateY(21vh) scale(1.28); }
  82%  { transform:translateY(0) scale(1); }
  100% { transform:translateY(0) scale(1); } }
/* שלב 3: קלף זהב מטאלי */
#celeb .cel-card { position:relative; border:1.5px solid #8a6414;
  background:
    linear-gradient(120deg, rgba(255,255,255,.30) 0%, rgba(255,255,255,0) 42%),
    repeating-linear-gradient(105deg, rgba(255,255,255,.055) 0 2px, rgba(120,80,10,.05) 2px 4px),
    linear-gradient(150deg,#f7e2a0 0%,#e9c568 26%,#d4a437 52%,#c08f2a 74%,#a87b1e 100%);
  outline:1px solid rgba(246,217,118,.55); outline-offset:7px;
  border-radius:26px; padding:48px 110px 42px; display:flex; flex-direction:column; align-items:center; gap:12px;
  box-shadow:0 30px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.55), inset 0 -14px 40px rgba(120,80,10,.22); }
#celeb.on .cel-card { animation:celpop .85s cubic-bezier(.22,1,.36,1) 1.5s both; }
@keyframes celpop { 0%{transform:scale(.55) translateY(40px); opacity:0; filter:blur(6px);}
  60%{transform:scale(1.06) translateY(-6px); opacity:1; filter:blur(0);} 100%{transform:scale(1) translateY(0);} }
#celeb .cel-card::before, #celeb .cel-card::after { content:''; position:absolute; width:26px; height:26px; border-color:rgba(74,54,8,.65); border-style:solid; }
#celeb .cel-card::before { top:10px; right:10px; border-width:2.5px 2.5px 0 0; border-radius:0 8px 0 0; }
#celeb .cel-card::after  { bottom:10px; left:10px; border-width:0 0 2.5px 2.5px; border-radius:0 0 0 8px; }
#celeb .cel-sheen { position:absolute; inset:0; border-radius:inherit; overflow:hidden; pointer-events:none; }
#celeb .cel-sheen::before { content:''; position:absolute; top:-30%; bottom:-30%; width:32%; left:-55%;
  background:linear-gradient(105deg, transparent, rgba(255,255,255,.4) 50%, transparent);
  transform:skewX(-18deg); animation:celsheen 4.6s ease-in-out 2.6s infinite; }
@keyframes celsheen { 0%{left:-55%;} 40%{left:125%;} 100%{left:125%;} }
#celeb .cel-av { width:152px; height:152px; border-radius:50%; padding:5px;
  background:conic-gradient(#6b4c12,#3a2a08,#8a6414,#4a3608,#6b4c12); box-shadow:0 6px 18px rgba(90,60,10,.4); }
#celeb .cel-avin { width:100%; height:100%; border-radius:50%; background:linear-gradient(135deg,#3a2c10,#1c1408);
  display:flex; align-items:center; justify-content:center; font-family:'Suez One','Heebo',serif; font-size:60px; color:#f6d976;
  border:2px solid #b8912e; position:relative; overflow:hidden; }
#celeb .cel-name { font-family:'Suez One','Heebo',serif; font-size:56px; color:#2e2106; letter-spacing:.5px;
  text-shadow:0 1px 0 rgba(255,255,255,.35); }
#celeb.on .cel-name { animation:celfade .55s ease 1.85s both; }
#celeb .cel-role { font-size:16px; font-weight:700; color:#6b520f; letter-spacing:3.5px; margin-top:-6px; }
#celeb.on .cel-role { animation:celfade .55s ease 1.95s both; }
#celeb .cel-amount { font-size:64px; font-weight:900; color:#3a2806; font-variant-numeric:tabular-nums; margin-top:8px;
  text-align:center; text-shadow:0 1px 0 rgba(255,255,255,.35); }
#celeb.on .cel-amount { animation:celfade .5s ease 2.05s both; }
#celeb .cel-amount .lbl { display:block; font-size:15px; font-weight:700; color:#6b520f; letter-spacing:2px; text-align:center; }
#celeb .cel-tag { margin-top:10px; font-size:16px; font-weight:700; color:#f6d976; background:linear-gradient(135deg,#2a1e08,#171005);
  padding:8px 26px; border-radius:99px; box-shadow:0 4px 12px rgba(60,40,5,.4); }
#celeb.on .cel-tag { animation:celfade .5s ease 2.2s both; }
@keyframes celfade { 0%{opacity:0; transform:translateY(18px);} 100%{opacity:1; transform:translateY(0);} }
/* שלב 2: פיצוץ קונפטי מהמרכז + גשם מתמשך + נצנוצים */
#celeb .cel-burst { position:absolute; left:50%; top:44%; width:var(--w,10px); height:var(--h,14px);
  background:var(--clr,#f6d976); border-radius:var(--br,2px); opacity:0;
  animation:celburst var(--bdur,1.7s) cubic-bezier(.18,.8,.3,1) var(--bdel,1.1s) forwards; }
@keyframes celburst { 0%{transform:translate(-50%,-50%) rotate(0deg) scale(1.2); opacity:0;} 4%{opacity:1;}
  62%{transform:translate(calc(-50% + var(--bx,0px)), calc(-50% + var(--by,0px))) rotate(var(--brot,540deg)); opacity:1;}
  100%{transform:translate(calc(-50% + var(--bx,0px)), calc(-50% + var(--by,0px) + 30vh)) rotate(calc(var(--brot,540deg) + 180deg)); opacity:0;} }
#celeb .cel-drop { position:absolute; top:-14vh; animation:celrain var(--dur,4s) linear var(--del,0s) infinite; }
@keyframes celrain { 0%{transform:translate3d(0,0,0); opacity:1;} 90%{opacity:1;}
  100%{transform:translate3d(var(--dx,0px),128vh,0); opacity:0;} }
#celeb .cel-drop i { display:block; width:var(--w,10px); height:var(--h,14px); background:var(--clr,#f6d976);
  border-radius:var(--br,2px); animation:celtumble var(--tdur,1.3s) ease-in-out var(--tdel,0s) infinite; }
@keyframes celtumble { 0%{transform:rotate(var(--r0,0deg)) rotateX(0deg);}
  50%{transform:rotate(calc(var(--r0,0deg) + 70deg)) rotateX(180deg);}
  100%{transform:rotate(var(--r0,0deg)) rotateX(360deg);} }
#celeb .cel-star { position:absolute; clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);
  background:linear-gradient(135deg,#fff3c4,#f6d976); animation:celtwinkle var(--dur,2.2s) ease-in-out var(--del,0s) infinite; }
@keyframes celtwinkle { 0%,100%{opacity:0; transform:scale(.4) rotate(0deg);} 50%{opacity:1; transform:scale(1) rotate(20deg);} }
#celeb .cel-timer { position:absolute; bottom:0; left:0; right:0; height:3px; z-index:20; transform-origin:right;
  background:linear-gradient(90deg,#f6d976,#d4a437); }
#celeb.on .cel-timer { animation:celshrink 7s linear forwards; }
@keyframes celshrink { from{transform:scaleX(1);} to{transform:scaleX(0);} }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div class="brand">
    <img class="brand-img" src="logo_trim.png" alt="יש לי זכות">
  </div>
  <div class="center-top">
    <div class="quote" id="quote">"קשה יש רק בלחם, וגם אותו אוכלים."</div>

<script>
/* ============================================================
   הגדרות — כשמפרסמים את הלשונית "דשבורד נציגים" כ-CSV,
   מדביקים כאן את הקישור (שמסתיים ב-output=csv).
   כל עוד CSV_URL ריק → רץ במצב הדגמה עם נתונים לדוגמה.
   ============================================================ */
const CONFIG = {
  CSV_URL: "https://script.google.com/macros/s/AKfycbw12rfEOC_dGqf9WWN6F-LvfLmzBv5nMH93joaOjuK0PPI7kjqwYgLLq_3WZFdvP6K1/exec",  // Apps Script — סופר מהנתון הגולמי, מזהה חודש לבד, בזמן אמת (ללא מטמון)
  REFRESH_MS: 8000,         // רענון כל 8 שניות בשעות העבודה
  IDLE_REFRESH_MS: 60000,   // מחוץ לשעות העבודה — כל דקה. המסך דולק 24/7 אבל המשרד לא, וזה מה ששומר אותנו בתוך מכסת גוגל
  WORK_START_HOUR: 8,       // תחילת שעות העבודה (א׳–ה׳)
  WORK_END_HOUR: 20,        // סוף שעות העבודה
  MAX_BACKOFF_MS: 60000,    // כשגוגל מחזיר תשובות פגומות — מאיטים עד דקה בין ניסיונות, ואז חוזרים לקצב הרגיל
  QUOTE_ROTATE_MS: 15000,   // החלפת משפט מוטיבציה כל 15 שניות
  VERSION_CHECK_MS: 180000, // בדיקה כל 3 דקות אם נפרסה גרסה חדשה של הדף. 0 = לכבות
  WORK_DAYS: null,          // ימי עבודה בחודש: null = חישוב אוטומטי (א׳–ה׳ של החודש הנוכחי). לדריסה ידנית (חודש עם חגים) — שים מספר, למשל 20
  SCROLL_SPEED: 32,         // מהירות גלילת הקרוסלה (פיקסלים לשנייה) — גדול יותר = מהיר יותר
  DEMO: false,              // מצב הדגמה כבוי — מחובר לגיליון אמיתי
  CELEB_ENABLED: true,      // אנימציית "עסקה נסגרה" כשעולה "גויסו בפועל" של נציג
  CELEB_SECONDS: 7,         // משך הצגת החגיגה לפני חזרה לדשבורד
  CELEB_MAX_JUMP: 3,        // עלייה גדולה מזו בבת אחת = תיקון נתונים בגיליון, לא סגירה — בלי חגיגה
  CELEB_CONFIRM_POLLS: 1,   // עלייה חוגגת מיד. (היה 2 כהגנה מריצוד המטמון של הפרסום — עם Apps Script אין מטמון ואין ריצוד)
  CELEB_DOWN_POLLS: 22,     // ירידה מתקבלת כתיקון אמיתי רק אחרי שהחזיקה כך-וכך משיכות רצופות (22×8שנ' ≈ 3 דקות)
  DATA_CONFIRM_POLLS: 1,    // ייצוב תצוגה: מציג מיד. (היה 2 מאותה סיבה — כבר לא נדרש)
  QUOTE: '"קשה יש רק בלחם, וגם אותו אוכלים."'
};

/* נתוני דוגמה במבנה האמיתי (שם תצוגה, יעד, גויסו) */
let DATA = [
  { name:"אליאור", target:50, actual:31 },
  { name:"דניאל",  target:50, actual:33 },
  { name:"ירין",   target:30, actual:16 },
  { name:"דימה",   target:45, actual:14 },
  { name:"שחר",    target:40, actual:9  },
  { name:"לירז",   target:35, actual:12 },
  { name:"יוסי",   target:30, actual:7  },
  { name:"אלירן",  target:35, actual:5  },
  { name:"נעמי",   target:30, actual:4  },
  { name:"שי",     target:30, actual:6  },
  { name:"אלי",    target:30, actual:3  },
  { name:"עדן",    target:25, actual:2  },
];

let prevPct = {};   // לשמירת אחוז קודם לחיצי הטיקר
let prevActual = {}; // לזיהוי עלייה (bump)
/* סך כל העסקאות בחודש כפי שנספרו בגיליון הגולמי — כולל נציגים שהוסרו
   מלשונית התצוגה. null = הפיד לא מספק אותו (Apps Script ישן), ואז
   מסתכמים רק הנציגים המוצגים, בדיוק כמו קודם. */
let GRAND_TOTAL = null;
// כשמחוברים לגיליון — לא מציירים כלום עד שהנתונים האמיתיים הגיעו (כדי שלא יבזיק נתוני דוגמה)
let dataReady = !CONFIG.CSV_URL;

const pct = a => a.target>0 ? Math.round(a.actual/a.target*100) : 0;
const sorted = () => [...DATA].sort((x,y)=> y.actual-x.actual || pct(y)-pct(x));
const firstLetter = n => (n||"?").trim().charAt(0);
/* עיגול נציג: מנסה תמונה מתיקיית photos (לפי שם התצוגה), ואם אין — מציג את האות הראשונה.
   מנסה .jpg ואז .png ואז .jpeg, ואם כלום לא נמצא — נשארת האות. */
function avatarInner(name){
  const letter = firstLetter(name);
  const file = (typeof PHOTOS!=='undefined' && PHOTOS[name]) ? String(PHOTOS[name]).trim() : '';
  if(file){
    const src = /^(https?:|data:)/.test(file) ? file : 'photos/'+file;   // base64 / כתובת מלאה / קובץ מקומי
    return `<span class="av-letter">${letter}</span>`+
      `<img class="av-photo" src="${src}" alt="" onerror="this.remove()">`;
  }
  return `<span class="av-letter">${letter}</span>`;   // אין תמונה — האות הראשונה
}

/* ---------- שעון + תאריך ---------- */
function heGematria(n){
  if(n===15) return 'ט״ו';
  if(n===16) return 'ט״ז';
  const ones=['','א','ב','ג','ד','ה','ו','ז','ח','ט'];
  const tens=['','י','כ','ל'];
  let s = tens[Math.floor(n/10)] + ones[n%10];
  if(s.length>=2) return s.slice(0,-1)+'״'+s.slice(-1);
  if(s.length===1) return s+'׳';
  return s;
}
function tickClock(){
  const now=new Date();
  document.getElementById('clock').textContent =
    String(now.getHours()).padStart(2,'0')+":"+String(now.getMinutes()).padStart(2,'0');
  document.getElementById('dateGreg').textContent =
    new Intl.DateTimeFormat('he-IL',{day:'2-digit',month:'2-digit',year:'numeric'}).format(now);
  try {
    const parts=new Intl.DateTimeFormat('he-u-ca-hebrew',{day:'numeric',month:'long'}).formatToParts(now);
    const day=parseInt(parts.find(p=>p.type==='day').value,10);
    let month=(parts.find(p=>p.type==='month').value||'').replace(/^ב/,'');
    document.getElementById('dateHeb').textContent = heGematria(day)+' ב'+month;
  } catch(e){ document.getElementById('dateHeb').textContent=''; }
}

/* ---------- רינדור ---------- */
function render(){
  if(!dataReady){ document.getElementById('src').textContent='מתחבר לגיליון…'; return; }  // עד שהנתונים האמיתיים מגיעים — לא מציירים
  const list = sorted();
  /* הסכום מגיע מהגיליון הגולמי כשהוא זמין, כדי שהסרת נציג מלשונית
     התצוגה לא תגרע את העסקאות שלו מסך החודש. */
  const shown = DATA.reduce((s,a)=>s+a.actual,0);
  const total = GRAND_TOTAL!=null ? GRAND_TOTAL : shown;
  document.getElementById('totalNum').textContent = total;

  /* ההפרש בין הסכום האמיתי לסכום המוצגים = העסקאות של מי שהוסר.
     מחושב כאן ומצויר כשורה בטבלה בלבד — לעולם לא נכנס ל-DATA, ולכן
     לא יכול להגיע לפודיום, למדליות או למנוע החגיגות. */
  const removed = GRAND_TOTAL!=null ? Math.max(0, GRAND_TOTAL - shown) : 0;

  renderPodium(list);
  renderMedals(list);
  renderTable(list, removed);

  list.forEach(a=>{ prevActual[a.name]=a.actual; prevPct[a.name]=pct(a); });
}

function renderPodium(list){
  const td = a => (a.today!==undefined ? a.today : a.actual);     // ספירה יומית
  const top=[...list].sort((x,y)=> td(y)-td(x) || pct(y)-pct(x)).slice(0,3);  // מובילים יומי
  const order=[1,0,2]; // מימין לשמאל: 2,1,3 (הראשון באמצע גבוה עם כתר)
  const cls=['p1','p2','p3'];
  const heights=[124,98,78];  // גובה קבוע לפי דירוג: 1 הכי גבוה
  const el=document.getElementById('podium'); el.innerHTML='';
  order.forEach(rank=>{
    const a=top[rank]; if(!a) return;
    const d=document.createElement('div'); d.className='pod '+cls[rank];
    d.innerHTML=`<div class="pod-crown" style="opacity:${rank===0?1:0}">👑</div>
      <div class="pod-name">${a.name}</div>
      <div class="pod-bar" style="height:${heights[rank]}px"><div class="pod-num">${td(a)}</div></div>`;
    el.appendChild(d);
  });
}

function renderMedals(list){
  const top=list.slice(0,3);   // list כבר ממוין לפי הספירה החודשית (גויסו בפועל)
  const order=[2,0,1]; // מימין לשמאל: ארד, זהב(אמצע), כסף
  const styles={0:{c:'gold',b:'🥇'},1:{c:'silver',b:'🥈'},2:{c:'bronze',b:'🥉'}};
  const el=document.getElementById('medals'); el.innerHTML='';
  order.forEach(rank=>{
    const a=top[rank]; if(!a) return;
    const s=styles[rank];
    const d=document.createElement('div'); d.className='medal '+s.c;
    d.innerHTML=`<div class="medal-badge">${s.b}</div>
      <div class="medal-av">${avatarInner(a.name)}</div>
      <div class="medal-name">${a.name}</div>
      <div class="medal-lbl">מכירות החודש</div>
      <div class="medal-num">${a.actual}+</div>`;
    el.appendChild(d);
  });
}

function money(v){ return '<span class="cur">₪</span>'+ (Number(v)||0).toLocaleString('he-IL'); }
function workDaysInMonth(){   // ימי עבודה א׳–ה׳ בחודש הנוכחי (בלי שישי=5 ושבת=6)
  const now=new Date(), y=now.getFullYear(), m=now.getMonth();
  const days=new Date(y,m+1,0).getDate(); let c=0;
  for(let d=1; d<=days; d++){ const wd=new Date(y,m,d).getDay(); if(wd!==5 && wd!==6) c++; }
  return c;
}
function avgDaily(a){
  const wd = (typeof CONFIG.WORK_DAYS==='number' && CONFIG.WORK_DAYS>0) ? CONFIG.WORK_DAYS : workDaysInMonth();
  return ((a.actual||0)/Math.max(1,wd)).toFixed(1);   // ממוצע יומי = גויסו בפועל ÷ ימי עבודה בחודש
}
function rowHTML(a){
  const p=pct(a); const hot=p>=50;
  return `<div class="row${hot?' hot':''}" data-name="${a.name}">
    <div class="r-name"><div class="r-av">${avatarInner(a.name)}</div><div class="r-namet">${a.name}</div></div>
    <div class="r-cell"><div class="r-val">${a.actual}</div>
      <div class="r-bar"><i class="${hot?'bar-fill':'bar-cool'}" style="width:${Math.min(100,p)}%"></i></div></div>
    <div class="r-cell"><div class="r-val">${a.target}</div>
      <div class="r-bar bar-track-full"><i></i></div></div>
    <div class="r-pct ${hot?'hot':'cool'}">${p}%</div>
    <div class="r-avg">${avgDaily(a)}</div>
    <div class="r-money">${money(a.commission)}</div>
    <div class="r-money bonus">${money(a.bonus)}</div>
    <div class="r-late${(a.late||0)>0?' has':''}">${a.late||0}</div></div>`;
}

/* שורת "משתמשים מחוקים" — סיכום העסקאות של נציגים שהוסרו מלשונית התצוגה.
   אותו מבנה של שמונה תאים כמו שורה רגילה, אבל בלי יעד ובלי אחוז: אין לה
   יעד ואין טעם לדרג אותה מול אנשים. מוצגת רק כשיש בה משהו. */
function removedRowHTML(n){
  return `<div class="row removed">
    <div class="r-name"><div class="r-av">✕</div><div class="r-namet">משתמשים מחוקים</div></div>
    <div class="r-cell"><div class="r-val">${n}</div></div>
    <div class="r-cell"><div class="r-val">—</div></div>
    <div class="r-pct">—</div>
    <div class="r-avg">—</div>
    <div class="r-money">—</div>
    <div class="r-money bonus">—</div>
    <div class="r-late">—</div></div>`;
}

/* קרוסלה — גלילה רציפה אינסופית */
let carScroll=0, carLast=0, carHalf=0, carOn=false;
function renderTable(list, removed){
  const cont=document.getElementById('rows');
  // כולל בונוס ואיחורים — הם מוזנים ידנית ומשתנים בלי שגויסו/יעד ישתנו, אחרת העמודות שלהם היו נתקעות
  const sig=list.map(a=>a.name+':'+a.actual+'/'+a.target+'/'+(a.bonus||0)+'/'+(a.late||0)).join('|')+'#'+(removed||0);
  if(cont.dataset.sig===sig) return;   // אין שינוי בנתונים — לא בונים מחדש, הגלילה ממשיכה חלק
  cont.dataset.sig=sig;
  const single=list.map(rowHTML).join('') + ((removed||0)>0 ? removedRowHTML(removed) : '');
  cont.innerHTML='<div class="rows-track" id="rowsTrack">'+single+'</div>';
  const track=document.getElementById('rowsTrack');
  carOn = track.scrollHeight > cont.clientHeight + 6;   // לגלול רק אם יש יותר ממה שנכנס
  if(carOn){
    track.innerHTML = single + single;                 // הכפלה ללולאה חלקה
    carHalf = track.scrollHeight/2;
  } else {
    carHalf=0; carScroll=0; track.style.transform='';
  }
}

function carouselLoop(ts){
  if(carOn && carHalf>0){
    if(!carLast) carLast=ts;
    const dt=ts-carLast; carLast=ts;
    carScroll += (CONFIG.SCROLL_SPEED||32) * dt/1000;  // פיקסלים לשנייה
    if(carScroll>=carHalf) carScroll-=carHalf;
    const t=document.getElementById('rowsTrack');
    if(t) t.style.transform='translateY('+(-carScroll)+'px)';
  } else { carLast=0; }
  requestAnimationFrame(carouselLoop);
}
requestAnimationFrame(carouselLoop);
// אם הטאב יורד לרקע וחוזר — לאפס את שעון הגלילה כדי שלא תהיה קפיצה
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ carLast=0; } });

/* ============================================================
   שער תקינות: לפעמים גוגל מחזיר דף HTML (עומס/מכסה/מסך ביניים)
   במקום הנתונים. בלי הבדיקה הזו הדשבורד היה מפרש את קוד ה-JS
   של הדף כשמות נציגים ומציג זבל על המסך. אם התשובה לא נראית
   כמו הפיד שלנו — מתעלמים ממנה לגמרי ונשארים על הנתונים הקודמים.
   ============================================================ */
const FEED_HEADER='שם תצוגה';          // חייב להופיע בשורה הראשונה של פיד תקין
function looksLikeOurFeed(text){
  if(!text) return false;
  const t=text.replace(/^﻿/,'').trimStart();
  if(/^\s*</.test(t)) return false;                       // HTML/XML — לא הפיד שלנו
  if(/<!DOCTYPE|<html|<script|window\[|ppConfig/i.test(t.slice(0,400))) return false;
  const first=t.split(/\r?\n/,1)[0]||'';
  return first.indexOf(FEED_HEADER)!==-1;                 // שורת הכותרת הנכונה
}

/* ---------- טעינת נתונים מ-CSV ---------- */
let badFeedStreak=0;
async function loadCSV(){
  if(!CONFIG.CSV_URL) return false;
  try{
    const res=await fetch(CONFIG.CSV_URL+(CONFIG.CSV_URL.includes('?')?'&':'?')+'_t='+Date.now());
    const text=await res.text();
    if(!res.ok || !looksLikeOurFeed(text)){               // תשובה פגומה — לא נוגעים במסך
      badFeedStreak++;
      const el=document.getElementById('src');
      if(el) el.textContent='תשובה לא תקינה מהגיליון ('+badFeedStreak+') — מציג את הנתונים האחרונים';
      return false;
    }
    badFeedStreak=0;
    const parsed=parseCSV(text);
    if(parsed.length){
      detectDeals(parsed);                       // מנוע החגיגות מקבל את הפיד הגולמי — יש לו הגנות ריצוד משלו
      const stable=stabilizeData(parsed);        // התצוגה מקבלת רק נתונים שאושרו בשתי משיכות רצופות
      if(stable){ DATA=stable; GRAND_TOTAL = (stable.grand!=null && stable.grand>0) ? stable.grand : null; }
      dataReady=true;
      document.getElementById('src').textContent='מחובר לגיליון • עודכן '+new Date().toLocaleTimeString('he-IL'); return true;
    }
  }catch(e){ document.getElementById('src').textContent='שגיאת חיבור לגיליון — ' + e.message; }
  return false;
}
/* ============================================================
   ייצוב תצוגה מול ריצוד המטמון של גוגל:
   אחרי עדכון בגיליון, הפיד המפורסם מגיש כמה דקות לסירוגין גרסה
   ישנה/חדשה. כדי שהמסך לא יקפוץ הלוך-חזור — שינוי מוצג רק אחרי
   שחזר זהה DATA_CONFIRM_POLLS משיכות רצופות. הטעינה הראשונה
   מוצגת מיד. עד לאישור — נשארים על הנתונים הקודמים.
   ============================================================ */
let stAccepted=null, stPending=null, stCount=0;
function stabilizeData(parsed){
  const sig=JSON.stringify(parsed.map(a=>[a.name,a.target,a.actual,a.today,a.commission,a.bonus,a.late]));
  if(stAccepted===null){ stAccepted=sig; return parsed; }            // טעינה ראשונה — מציגים מיד
  if(sig===stAccepted){ stPending=null; stCount=0; return parsed; }  // זהה למה שמוצג — ממשיכים כרגיל
  if(sig===stPending){ stCount++; } else { stPending=sig; stCount=1; }
  if(stCount>=(CONFIG.DATA_CONFIRM_POLLS||2)){                       // השינוי החזיק מעמד — מאשרים
    stAccepted=sig; stPending=null; stCount=0; return parsed;
  }
  return null;                                                       // עדיין לא מאושר — המסך נשאר יציב
}

/* מצפה לעמודות: שם תצוגה, (מפתח), יעד, גויסו  — מזהה לפי כותרות */
function parseCSV(text){
  const lines=text.trim().split(/\r?\n/).filter(l=>l.trim());
  if(lines.length<2) return [];
  const split=l=>l.match(/("([^"]|"")*"|[^,]*)(,|$)/g).slice(0,-1).map(c=>c.replace(/^,|,$/,'').replace(/^"|"$/g,'').replace(/""/g,'"').trim());
  const head=split(lines[0]).map(h=>h.trim());
  const idx=(...names)=>head.findIndex(h=> names.some(n=>h.includes(n)));
  let iName=idx('שם תצוגה','שם נציג','נציג','שם');
  let iTarget=idx('יעד');
  let iToday=idx('היום');                 // עמודת "גויסו היום"
  let iActual=idx('בפועל');               // "גויסו בפועל" (חודשי)
  if(iActual<0) iActual=head.findIndex((h,i)=> i!==iToday && (h.includes('גויסו')||h.includes('כמות')));
  let iComm=idx('עמלות','עמלה');           // עמלות
  let iBonus=idx('בונוס');                 // בונוס יומי
  let iLate=idx('איחורים','איחור');        // איחורים
  let iGrand=idx('סך הכל כללי');           // סך כל העסקאות בחודש, כולל נציגים שהוסרו מהתצוגה
  if(iName<0) iName=0;
  const num=v=>parseFloat((v||'0').replace(/[^\d.]/g,''))||0;
  const out=[];
  for(let r=1;r<lines.length;r++){
    const c=split(lines[r]); if(!c[iName]) continue;
    const name=c[iName].trim(); if(!name) continue;
    const target=num(c[iTarget]);
    const actual=num(c[iActual]);
    const today=iToday>=0 ? num(c[iToday]) : actual;   // אם אין עמודת "היום" — נופלים לחודשי
    const commission=iComm>=0 ? num(c[iComm]) : 0;
    const bonus=iBonus>=0 ? num(c[iBonus]) : 0;
    const late=iLate>=0 ? num(c[iLate]) : 0;
    out.push({name,target,actual,today,commission,bonus,late});
    /* הסכום הכללי זהה בכל השורות — נלקח מהראשונה שנקראה. אם הפיד עדיין
       ישן ואין בו את העמודה, נשאר null והתצוגה מתנהגת בדיוק כמו קודם. */
    if(out.grand===undefined && iGrand>=0) out.grand=num(c[iGrand]);
  }
  if(out.grand===undefined) out.grand=null;
  return out;
}

/* ---------- מצב הדגמה: מספרים זזים לבד ---------- */
function demoStep(){
  const n=1+Math.floor(Math.random()*2);
  for(let i=0;i<n;i++){
    const a=DATA[Math.floor(Math.random()*DATA.length)];
    a.actual+=1; if(a.actual>a.target) a.target=a.actual+5;
  }
}

/* ---------- לולאה ראשית ---------- */
async function refresh(){
  let ok=true;
  if(CONFIG.CSV_URL){ ok=await loadCSV(); }
  else if(CONFIG.DEMO){ demoStep(); detectDeals(DATA); }
  render();
  return ok;                                  // false = תשובה פגומה → הלולאה תאט
}
tickClock(); setInterval(tickClock,1000);
/* לולאת רענון עם האטה מדורגת: כשגוגל מחזיר תשובות פגומות (עומס/מכסה),
   ממשיכים לנסות אבל בקצב הולך ויורד — במקום להציף אותו ולהחמיר את המצב.
   משיכה תקינה אחת מחזירה מיד לקצב הרגיל. */
function isWorkHours(){                       // א׳–ה׳ בשעות הפעילות
  const d=new Date(), day=d.getDay(), h=d.getHours();
  if(day===5 || day===6) return false;        // שישי ושבת
  return h>=(CONFIG.WORK_START_HOUR||8) && h<(CONFIG.WORK_END_HOUR||20);
}
(async function loop(){
  let ok=true;
  try{ ok=await refresh(); }catch(e){ ok=false; }
  const base = isWorkHours() ? (CONFIG.REFRESH_MS||8000) : (CONFIG.IDLE_REFRESH_MS||60000);
  const wait = ok ? base
    : Math.min(CONFIG.MAX_BACKOFF_MS||60000, base*Math.pow(2, Math.min(badFeedStreak,4)));
  setTimeout(loop, wait);
})();

/* מדידה מחדש (כדי שמספר העותקים יחושב נכון) — אחרי טעינת גופנים, טעינה מלאה, ושינוי גודל */
function forceRerender(){
  const r=document.getElementById('rows');   if(r) r.dataset.sig='';
  const t=document.getElementById('ticker'); if(t) t.dataset.sig='';
  render();
}
window.addEventListener('load', forceRerender);
window.addEventListener('resize', forceRerender);
if(document.fonts && document.fonts.ready){ document.fonts.ready.then(forceRerender); }

/* ---------- החלפת משפטי מוטיבציה כל 15 שניות (עם fade) ---------- */
let quoteIdx=0;
function showQuote(){
  const el=document.getElementById('quote'); if(!el) return;
  if(typeof QUOTES==='undefined' || !QUOTES.length) return;
  el.textContent = QUOTES[quoteIdx % QUOTES.length];
}
function rotateQuote(){
  if(typeof QUOTES==='undefined' || QUOTES.length<2) return;
  const el=document.getElementById('quote'); if(!el) return;
  el.style.opacity='0';
  setTimeout(()=>{ quoteIdx++; showQuote(); el.style.opacity='1'; }, 480);
}
showQuote();
setInterval(rotateQuote, CONFIG.QUOTE_ROTATE_MS);

/* ============================================================
   חגיגת "עסקה נסגרה"
   - מאזינה אך ורק לעלייה בעמודת "גויסו בפועל" של נציג.
   - טעינה ראשונה = קביעת בסיס בלבד (בלי חגיגות ברענון הדף).
   - נציג חדש בגיליון / ירידה במספר = עדכון בסיס בשקט, בלי חגיגה.
   - קפיצה גדולה מ-CELEB_MAX_JUMP בבת אחת = תיקון נתונים, בלי חגיגה.
   - תור: כמה סגירות במקביל או תוך כדי חגיגה — מוצגות זו אחר זו.
   ============================================================ */
const CELEB = { queue:[], active:false, base:null, timer:null };
const CEL_COLORS = ['#f6d976','#d4a437','#3d6fb8','#5b93ff','#7fa8d0','#aab8e8','#ffffff','#ff6a2c','#3fc78f'];
const celRnd = (a,b) => a + Math.random()*(b-a);
function celEl(cls, styles){ const s=document.createElement('span'); s.className=cls;
  for(const k in styles) s.style.setProperty(k, styles[k]); return s; }
function celPiece(){ const ribbon=Math.random()<.3;
  return { '--clr':CEL_COLORS[Math.floor(Math.random()*CEL_COLORS.length)],
    '--w':celRnd(7,12)+'px', '--h':ribbon?celRnd(20,30)+'px':celRnd(9,15)+'px',
    '--br':ribbon?'4px':(Math.random()<.35?'50%':'2px') }; }

/* לכל נציג נשמר מצב: v=בסיס מאושר, up/down=מוני משיכות רצופות, upVal=הערך הגבוה האחרון.
   ההגנה המרכזית: הפיד המפורסם של גוגל מרצד בין גרסה ישנה לחדשה כמה דקות אחרי עדכון —
   לכן עלייה חוגגת רק אחרי שהחזיקה CONFIRM_POLLS משיכות רצופות, והבסיס לעולם לא יורד
   מריצוד רגעי (רק ירידה יציבה לאורך DOWN_POLLS מתקבלת כתיקון אמיתי). */
function detectDeals(list){
  if(CELEB.base===null){ CELEB.base={}; list.forEach(a=>CELEB.base[a.name]={v:a.actual, up:0, down:0, upVal:0}); return; }
  list.forEach(a=>{
    const s=CELEB.base[a.name];
    if(s===undefined){ CELEB.base[a.name]={v:a.actual, up:0, down:0, upVal:0}; return; }
    if(a.actual>s.v){
      s.up++; s.upVal=a.actual; s.down=0;
      if(s.up>=(CONFIG.CELEB_CONFIRM_POLLS||2)){
        const d=s.upVal-s.v; s.v=s.upVal; s.up=0;
        if(CONFIG.CELEB_ENABLED && d<=(CONFIG.CELEB_MAX_JUMP||3))
          enqueueCeleb({ name:a.name, total:s.v, delta:d });
      }
    } else if(a.actual<s.v){
      s.down++; s.up=0;
      if(s.down>=(CONFIG.CELEB_DOWN_POLLS||12)){ s.v=a.actual; s.down=0; }
    } else { s.up=0; s.down=0; }
  });
}
function enqueueCeleb(item){ CELEB.queue.push(item); pumpCeleb(); }
function pumpCeleb(){ if(CELEB.active || !CELEB.queue.length) return;
  CELEB.active=true; showCeleb(CELEB.queue.shift()); }

function showCeleb(it){
  const ov=document.getElementById('celeb');
  document.getElementById('celebAvatar').innerHTML = avatarInner(it.name);
  document.getElementById('celebName').textContent = it.name;
  document.getElementById('celebTag').textContent =
    it.delta>1 ? ('🔥 '+it.delta+' עסקאות חדשות ברצף!') : '🔥 עסקה חדשה נסגרה ממש עכשיו';
  const fx=ov.querySelector('.cel-fx'); fx.innerHTML='';
  for(let i=0;i<70;i++){   // פיצוץ מהמרכז
    const ang=celRnd(0,Math.PI*2), r=celRnd(16,52);
    fx.appendChild(celEl('cel-burst', Object.assign(celPiece(), {
      '--bx':(Math.cos(ang)*r)+'vh', '--by':(Math.sin(ang)*r*.8)+'vh',
      '--brot':celRnd(360,900)+'deg', '--bdur':celRnd(1.3,2)+'s', '--bdel':(1.1+celRnd(0,.12))+'s' })));
  }
  for(let i=0;i<70;i++){   // גשם קונפטי מתמשך אחרי הפיצוץ
    const drop=celEl('cel-drop', { left:celRnd(0,100)+'%', '--dx':celRnd(-140,140)+'px',
      '--dur':celRnd(3.4,6.5)+'s', '--del':celRnd(1.6,6)+'s' });
    const p=document.createElement('i');
    const st=Object.assign(celPiece(), { '--r0':celRnd(-60,60)+'deg', '--tdur':celRnd(.8,1.8)+'s', '--tdel':celRnd(0,1.5)+'s' });
    for(const k in st) p.style.setProperty(k, st[k]);
    drop.appendChild(p); fx.appendChild(drop);
  }
  for(let i=0;i<8;i++){    // נצנוצים
    fx.appendChild(celEl('cel-star', { width:celRnd(8,20)+'px', height:celRnd(8,20)+'px',
      left:celRnd(3,97)+'%', top:celRnd(5,92)+'%', '--dur':celRnd(1.6,3.2)+'s', '--del':celRnd(0,2.5)+'s' }));
  }
  const secs=Math.max(4, CONFIG.CELEB_SECONDS||7);
  ov.querySelector('.cel-timer').style.animationDuration = secs+'s';
  ov.classList.add('on');
  celCount(document.getElementById('celebCount'), it.total);
  CELEB.timer=setTimeout(()=>{
    ov.classList.remove('on'); fx.innerHTML=''; CELEB.active=false;
    setTimeout(pumpCeleb, 350);   // הבא בתור, אם מישהו סגר בינתיים
  }, secs*1000);
}
function celCount(el, to){
  el.textContent='0';
  const dur=1300, t0=performance.now()+2100;   // מתוזמן לחשיפת המספר על הקלף
  function step(t){ const p=Math.min(1,Math.max(0,(t-t0)/dur)); const e=1-Math.pow(1-p,3);
    el.textContent=Math.round(to*e).toLocaleString('he-IL');
    if(p<1 && document.getElementById('celeb').classList.contains('on')) requestAnimationFrame(step); }
  requestAnimationFrame(step);
}
/* בדיקה ידנית בלי לגעת בנתונים: Ctrl+Alt+C מדמה חגיגה של נציג אקראי,
   או מהקונסול: testCeleb('דניאל') */
window.testCeleb=function(name){
  const a = name ? DATA.find(x=>x.name===name) : DATA[Math.floor(Math.random()*DATA.length)];
  if(a) enqueueCeleb({ name:a.name, total:a.actual||0, delta:1 });
};
document.addEventListener('keydown', e=>{
  if(e.ctrlKey && e.altKey && (e.key==='c'||e.key==='C') && dataReady) window.testCeleb();
});

/* ============================================================
   רענון אוטומטי אחרי פריסה
   ------------------------------------------------------------
   הדשבורד מושך *נתונים* כל 8 שניות, אבל את *הקוד* של עצמו הוא
   טוען פעם אחת בלבד — כשנפתח. מסך שדולק שבוע מריץ קוד בן שבוע,
   וממלא אותו במספרים טריים. זה נראה בדיוק כמו תיקון שלא עבד.

   הפתרון: לשאול את השרת אם קובץ ה-HTML השתנה. ה-ETag של Render
   הוא hash של התוכן, ולכן הוא מתחלף לבד בכל פריסה — אין צורך
   לתחזק קובץ גרסה שאפשר לשכוח לעדכן.
   ============================================================ */
let pageStamp = null;

async function fetchPageStamp(){
  // query ייחודי עוקף את מטמון ה-CDN (s-maxage=300) ומגיע למקור,
  // אחרת פריסה חדשה הייתה מתגלה רק אחרי 5 דקות
  const res = await fetch(location.pathname + '?_v=' + Date.now(), { method:'HEAD', cache:'no-store' });
  if(!res.ok) return null;
  return res.headers.get('etag') || res.headers.get('last-modified');
}

async function checkForNewVersion(){
  if(location.protocol === 'file:') return;        // נפתח כקובץ מקומי — אין שרת לשאול
  let stamp;
  try { stamp = await fetchPageStamp(); }
  catch(e){ return; }                              // תקלת רשת — לא נוגעים במסך
  if(!stamp) return;                               // אין ETag — לא מנחשים, לא מרעננים
  if(pageStamp === null){ pageStamp = stamp; return; }   // מדידת הבסיס הראשונה
  if(stamp === pageStamp) return;                  // אותה גרסה — אין מה לעשות

  // יש גרסה חדשה. חגיגת "עסקה נסגרה" היא הרגע החשוב על המסך —
  // לא קוטעים אותה באמצע. מחכים שהתור יתרוקן ומנסים שוב.
  if(CELEB.active || CELEB.queue.length){ setTimeout(checkForNewVersion, 15000); return; }
  location.reload();
}

if(CONFIG.VERSION_CHECK_MS > 0){
  setTimeout(checkForNewVersion, 4000);            // קביעת בסיס מיד אחרי הטעינה
  setInterval(checkForNewVersion, CONFIG.VERSION_CHECK_MS);
}
</script>
